<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu blog tech</title>
    <style>
        /* Configurações gerais do corpo do site */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
        }

        /* Banner/Cabeçalho azul escuro */
        header {
            background-color: #1a416b; /* Tom de azul escuro idêntico ao da imagem */
            color: #ffffff;
            text-align: center;
            padding: 25px 20px;
            margin-bottom: 30px;
        }

        /* Título principal dentro do banner */
        header h1 {
            margin: 0 0 15px 0;
            font-size: 32px;
            font-weight: bold;
        }

        /* Subtítulo dentro do banner */
        header p {
            margin: 0;
            font-size: 16px;
            font-weight: normal;
        }

        /* Área de conteúdo dos posts (com margem nas laterais) */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* Título do post */
        .post-title {
            color: #1a416b;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Nome do autor */
        .post-author {
            color: #555555;
            font-size: 15px;
            margin-bottom: 20px;
        }

        /* Texto de introdução do post */
        .post-content {
            color: #444444;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho com o fundo azul -->
    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <!-- Conteúdo principal do blog -->
    <div class="container">
        <div class="post-title">Meu primeiro post</div>
        
        <div class="post-author">Por: Marcelo Paludetto</div>
        
        <p class="post-content">
            Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.
        </p>
    </div>

</body>
</html>
